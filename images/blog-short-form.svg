      <rect x="40" y="6" width="35" height="6" rx="3" fill="#3B0735"/>
      <!-- Video Frame Simulation -->
      <rect x="8" y="20" width="99" height="160" rx="10" fill="#3B0735"/>
      <polygon points="45,90 65,100 45,110" fill="#F472B6"/>
      <text x="15" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">#ViralHook</text>
      <text x="15" y="170" fill="#F472B6" font-family="sans-serif" font-size="8">8.4M Views</text>
    </g>

    <!-- Metrics on right -->
