      <text x="20" y="24" fill="#F5D0FE" font-family="sans-serif" font-size="10">BLENDED ORGANIC REACH</text>
      <text x="20" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">14,200,000+ Impressions</text>

