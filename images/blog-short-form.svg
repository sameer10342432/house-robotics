<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVideo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A044E"/>
      <stop offset="100%" stop-color="#701A75"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgVideo)"/>
  
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="520" height="270" rx="14" fill="#2E0827" stroke="#C026D3" stroke-width="1.5"/>
    <text x="30" y="35" fill="#F5D0FE" font-family="sans-serif" font-size="14" font-weight="bold">Viral Short-Form Content Production Engine</text>

    <!-- Phone Reel Frame in center-left -->
    <g transform="translate(40, 55)">
