      <text x="20" y="89" fill="#F5D0FE" font-family="sans-serif" font-size="10">STUDIO CADENCE</text>
      <text x="20" y="111" fill="#34D399" font-family="sans-serif" font-size="18" font-weight="bold">30 High-Value Reels / Mo</text>

      <rect x="0" y="130" width="300" height="60" rx="8" fill="#701A75"/>
