<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgMap)"/>
  
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="520" height="270" rx="14" fill="#021C16" stroke="#059669" stroke-width="1.5"/>
    <text x="30" y="35" fill="#A7F3D0" font-family="sans-serif" font-size="14" font-weight="bold">Google Maps 3-Pack Dominance Architecture</text>

    <!-- Map Pin Grid with Green #1s -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="460" height="180" rx="10" fill="#042F24" stroke="#047857" stroke-width="1"/>
      
      <!-- Roads -->
      <line x1="0" y1="60" x2="460" y2="60" stroke="#065F46" stroke-width="6"/>
      <line x1="0" y1="120" x2="460" y2="120" stroke="#065F46" stroke-width="4"/>
      <line x1="120" y1="0" x2="120" y2="180" stroke="#065F46" stroke-width="4"/>
      <line x1="280" y1="0" x2="280" y2="180" stroke="#065F46" stroke-width="8"/>
      <line x1="380" y1="0" x2="380" y2="180" stroke="#065F46" stroke-width="4"/>

      <!-- Geo-Grid Pins with Rank 1 -->
      <circle cx="60" cy="35" r="14" fill="#10B981"/><text x="56" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="160" cy="35" r="14" fill="#10B981"/><text x="156" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="230" cy="35" r="14" fill="#10B981"/><text x="226" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="340" cy="35" r="14" fill="#10B981"/><text x="336" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="420" cy="35" r="14" fill="#10B981"/><text x="416" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>

      <circle cx="60" cy="90" r="14" fill="#10B981"/><text x="56" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="160" cy="90" r="14" fill="#10B981"/><text x="156" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <!-- Center Headquarters Pin -->
      <circle cx="280" cy="90" r="20" fill="#6D28D9" stroke="#A78BFA" stroke-width="3"/>
      <text x="274" y="96" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">HQ</text>
      <circle cx="340" cy="90" r="14" fill="#10B981"/><text x="336" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="420" cy="90" r="14" fill="#10B981"/><text x="416" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>

      <circle cx="60" cy="145" r="14" fill="#10B981"/><text x="56" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="160" cy="145" r="14" fill="#10B981"/><text x="156" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="230" cy="145" r="14" fill="#10B981"/><text x="226" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="340" cy="145" r="14" fill="#10B981"/><text x="336" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
      <circle cx="420" cy="145" r="14" fill="#34D399"/><text x="416" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
    </g>
  </g>
</svg>
