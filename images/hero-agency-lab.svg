<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="40%" stop-color="#181333"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
    <pattern id="labGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6D28D9" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#labBg)"/>
  <rect width="1200" height="675" fill="url(#labGrid)"/>

  <!-- Glowing architectural light pillars -->
  <circle cx="200" cy="150" r="280" fill="url(#purpleGlow)" filter="blur(80px)"/>
  <circle cx="1000" cy="200" r="320" fill="url(#cyanGlow)" filter="blur(90px)"/>
  <circle cx="600" cy="550" r="240" fill="url(#purpleGlow)" filter="blur(90px)"/>

  <!-- Perspective Floor Grid -->
  <path d="M 0 520 L 1200 520 L 1200 675 L 0 675 Z" fill="#08060f" opacity="0.9"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#6D28D9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="150" y1="520" x2="0" y2="675" stroke="#6D28D9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="350" y1="520" x2="200" y2="675" stroke="#6D28D9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="600" y1="520" x2="600" y2="675" stroke="#6D28D9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="850" y1="520" x2="1000" y2="675" stroke="#6D28D9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1050" y1="520" x2="1200" y2="675" stroke="#6D28D9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Center Floating Holographic Console -->
  <g transform="translate(300, 110)">
    <!-- Main Big Glass Dashboard -->
    <rect x="0" y="0" width="600" height="360" rx="20" fill="#13102B" stroke="#6D28D9" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="600" height="42" rx="20" fill="#1e1842" stroke-opacity="0.2"/>
    <circle cx="25" cy="21" r="5" fill="#EF4444"/>
    <circle cx="45" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="65" cy="21" r="5" fill="#10B981"/>
    <text x="95" y="26" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="bold">HOUSE ROBOTICS // AUTONOMOUS GROWTH KERNEL v4.2</text>
    <rect x="500" y="12" width="80" height="18" rx="9" fill="#10B981" fill-opacity="0.2"/>
    <text x="515" y="25" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">ONLINE</text>

    <!-- Metrics Cards inside screen -->
    <rect x="25" y="60" width="165" height="85" rx="12" fill="#1C173E" stroke="#4C1D95" stroke-width="1"/>
    <text x="40" y="85" fill="#94A3B8" font-family="sans-serif" font-size="11">ORGANIC ACQUISITION</text>
    <text x="40" y="118" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="bold">+342%</text>
    <path d="M 40 132 Q 80 120 120 126 T 170 110" fill="none" stroke="#10B981" stroke-width="2"/>

    <rect x="215" y="60" width="165" height="85" rx="12" fill="#1C173E" stroke="#4C1D95" stroke-width="1"/>
    <text x="230" y="85" fill="#94A3B8" font-family="sans-serif" font-size="11">AVG CONVERSION ROAS</text>
    <text x="230" y="118" fill="#38BDF8" font-family="sans-serif" font-size="24" font-weight="bold">4.85x</text>
    <path d="M 230 132 Q 270 124 310 115 T 360 102" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <rect x="405" y="60" width="170" height="85" rx="12" fill="#1C173E" stroke="#4C1D95" stroke-width="1"/>
    <text x="420" y="85" fill="#94A3B8" font-family="sans-serif" font-size="11">AI AGENT LATENCY</text>
    <text x="420" y="118" fill="#C084FC" font-family="sans-serif" font-size="24" font-weight="bold">42ms</text>
    <text x="420" y="134" fill="#A855F7" font-family="monospace" font-size="10">SUB-SECOND SYNC</text>

    <!-- Big Area Chart in Screen -->
    <rect x="25" y="165" width="550" height="170" rx="12" fill="#181335" stroke="#3730A3" stroke-width="1"/>
    <text x="40" y="190" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Unified Commercial Pipeline Velocity (Live Telemetry)</text>
    
    <!-- Gridlines inside chart -->
    <line x1="40" y1="220" x2="550" y2="220" stroke="#312E81" stroke-width="1" stroke-dasharray="4"/>
    <line x1="40" y1="260" x2="550" y2="260" stroke="#312E81" stroke-width="1" stroke-dasharray="4"/>
    <line x1="40" y1="300" x2="550" y2="300" stroke="#312E81" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Area gradient -->
    <path d="M 40 300 L 90 280 L 150 285 L 210 250 L 280 260 L 350 215 L 420 230 L 490 195 L 550 185 L 550 315 L 40 315 Z" fill="url(#purpleGlow)" opacity="0.3"/>
    <path d="M 40 300 L 90 280 L 150 285 L 210 250 L 280 260 L 350 215 L 420 230 L 490 195 L 550 185" fill="none" stroke="#A855F7" stroke-width="3"/>
    
    <!-- Secondary trendline -->
    <path d="M 40 310 L 100 305 L 180 290 L 260 270 L 340 255 L 420 240 L 500 215 L 550 205" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2 4"/>
  </g>

  <!-- Left Floating Device: High-Conversion Mobile Mockup -->
  <g transform="translate(90, 190)">
    <rect x="0" y="0" width="160" height="300" rx="24" fill="#0C0A1D" stroke="#8B5CF6" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
    <rect x="55" y="10" width="50" height="12" rx="6" fill="#1F1B3E"/>
    <rect x="15" y="35" width="130" height="50" rx="10" fill="#2E1065"/>
    <text x="25" y="55" fill="#DDD6FE" font-family="sans-serif" font-size="10" font-weight="bold">TOP 1 RANKING</text>
    <text x="25" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Google 3-Pack</text>
    <rect x="15" y="95" width="130" height="90" rx="10" fill="#181335"/>
    <circle cx="35" cy="115" r="10" fill="#10B981"/>
    <text x="55" y="118" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">Inbound Call</text>
    <text x="25" y="145" fill="#94A3B8" font-family="sans-serif" font-size="9">Verified High-Intent</text>
    <text x="25" y="165" fill="#A78BFA" font-family="sans-serif" font-size="11" font-weight="bold">$14,500 Retainer</text>
    <rect x="15" y="195" width="130" height="40" rx="8" fill="#6D28D9"/>
    <text x="45" y="220" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Schedule Audit</text>
  </g>

  <!-- Right Floating Device: Code & Core Web Vitals Monitor -->
  <g transform="translate(950, 190)">
    <rect x="0" y="0" width="170" height="280" rx="18" fill="#0E0C22" stroke="#38BDF8" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
    <rect x="15" y="15" width="140" height="60" rx="10" fill="#042F2E" stroke="#0D9488" stroke-width="1"/>
    <text x="25" y="35" fill="#5EEAD4" font-family="sans-serif" font-size="9" font-weight="bold">GOOGLE LIGHTHOUSE</text>
    <text x="25" y="62" fill="#2DD4BF" font-family="sans-serif" font-size="28" font-weight="black">100</text>
    <text x="85" y="55" fill="#99F6E4" font-family="sans-serif" font-size="11">Green Score</text>
    
    <rect x="15" y="85" width="140" height="175" rx="10" fill="#13102E"/>
    <text x="25" y="105" fill="#A5B4FC" font-family="monospace" font-size="9">&lt;HouseRobotics&gt;</text>
    <text x="25" y="125" fill="#94A3B8" font-family="monospace" font-size="9">  hydrate: eager</text>
    <text x="25" y="145" fill="#94A3B8" font-family="monospace" font-size="9">  speed: 0.28s</text>
    <text x="25" y="165" fill="#94A3B8" font-family="monospace" font-size="9">  cls: 0.00</text>
    <text x="25" y="185" fill="#94A3B8" font-family="monospace" font-size="9">  geo: active</text>
    <text x="25" y="210" fill="#A5B4FC" font-family="monospace" font-size="9">&lt;/HouseRobotics&gt;</text>
    <rect x="25" y="225" width="120" height="22" rx="4" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1"/>
    <text x="35" y="240" fill="#C4B5FD" font-family="sans-serif" font-size="9" font-weight="bold">✓ 0.00s TBT Speed</text>
  </g>

  <!-- High-Tech Floating Particle Badges -->
  <g transform="translate(530, 490)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1E1848" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="-85" cy="0" r="6" fill="#10B981"/>
    <text x="-70" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">REAL-TIME MULTI-CHANNEL SYNC</text>
  </g>
</svg>
