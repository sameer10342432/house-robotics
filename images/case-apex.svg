<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="apexAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#apexBg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="375" x2="800" y2="375"/><line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Laptop / Interface Mockup for Apex SaaS -->
  <g transform="translate(60, 45)">
    <!-- Browser Window Container -->
    <rect x="0" y="0" width="680" height="360" rx="16" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="38" rx="16" fill="#1E293B"/>
    <circle cx="25" cy="19" r="5" fill="#EF4444"/>
    <circle cx="45" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="65" cy="19" r="5" fill="#10B981"/>
    <rect x="180" y="10" width="320" height="18" rx="9" fill="#0F172A"/>
    <text x="230" y="23" fill="#94A3B8" font-family="monospace" font-size="11">app.apexcloud.io/dashboard</text>
    
    <!-- Sidebar -->
    <rect x="0" y="38" width="150" height="322" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <rect x="20" y="60" width="110" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="35" y="76" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="bold">Pipeline</text>
    <rect x="20" y="95" width="110" height="20" rx="4" fill="#1E293B"/>
    <rect x="20" y="125" width="110" height="20" rx="4" fill="#1E293B"/>
    <rect x="20" y="155" width="110" height="20" rx="4" fill="#1E293B"/>

    <!-- Main Content Area -->
    <text x="180" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Apex Cloud Enterprise Analytics</text>
    <text x="180" y="95" fill="#64748B" font-family="sans-serif" font-size="11">Automated organic inbound engine</text>

    <!-- Stat Cards -->
    <rect x="180" y="115" width="150" height="70" rx="10" fill="#1E293B"/>
    <text x="195" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">ARR GENERATED</text>
    <text x="195" y="165" fill="#10B981" font-family="sans-serif" font-size="20" font-weight="bold">$4.2M</text>

    <rect x="345" y="115" width="150" height="70" rx="10" fill="#1E293B"/>
    <text x="360" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">DEMO INBOUND</text>
    <text x="360" y="165" fill="#38BDF8" font-family="sans-serif" font-size="20" font-weight="bold">+340%</text>

    <rect x="510" y="115" width="145" height="70" rx="10" fill="#1E293B"/>
    <text x="525" y="135" fill="#94A3B8" font-family="sans-serif" font-size="10">ORGANIC KEYWORDS</text>
    <text x="525" y="165" fill="#C084FC" font-family="sans-serif" font-size="20" font-weight="bold">Top 3 (#1)</text>

    <!-- Chart -->
    <rect x="180" y="200" width="475" height="135" rx="10" fill="#141B2D"/>
    <path d="M 200 310 Q 280 290 350 240 T 520 220 T 630 215" fill="none" stroke="url(#apexAccent)" stroke-width="3"/>
    <circle cx="630" cy="215" r="5" fill="#8B5CF6"/>
    <rect x="550" y="225" width="90" height="24" rx="6" fill="#8B5CF6"/>
    <text x="560" y="241" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">+412% ARR</text>
  </g>
