    <script>
      // Ensure window.fetch has both a getter and a setter to prevent
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when preview frames or third-party wrappers assign to window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc) {
            var proto = Object.getPrototypeOf(window);
            if (proto) desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          }
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return originalFetch;
              },
              set: function(fn) {
                originalFetch = fn;
              }
            });
          }
        } catch (e) {
          // Gracefully suppress if non-configurable
        }
      })();
    </script>
