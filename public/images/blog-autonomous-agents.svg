<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180C2E"/>
      <stop offset="100%" stop-color="#2D1154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgAgent)"/>
  <circle cx="100" cy="80" r="140" fill="#9333EA" opacity="0.15" filter="blur(40px)"/>

  <!-- Autonomous AI Agent Flow Visual -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="520" height="270" rx="14" fill="#120A24" stroke="#9333EA" stroke-width="1.5"/>
    <text x="30" y="35" fill="#E9D5FF" font-family="sans-serif" font-size="14" font-weight="bold">Multi-Agent Lead Qualification Matrix</text>
    
    <!-- Step 1 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="130" height="180" rx="10" fill="#1E1238" stroke="#7E22CE" stroke-width="1"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#9333EA"/>
      <text x="23" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">01</text>
      <text x="15" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Inbound Signal</text>
      <text x="15" y="85" fill="#A855F7" font-family="sans-serif" font-size="10">Web visitor or form submit</text>
      <rect x="15" y="115" width="100" height="40" rx="6" fill="#2E1754"/>
      <text x="23" y="138" fill="#DDD6FE" font-family="monospace" font-size="9">Enrich Domain &amp; Tech Stack</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 175 150 L 195 150" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(195, 60)">
      <rect x="0" y="0" width="130" height="180" rx="10" fill="#1E1238" stroke="#7E22CE" stroke-width="1"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#3B82F6"/>
      <text x="23" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">02</text>
      <text x="15" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">AI Voice &amp; SMS</text>
      <text x="15" y="85" fill="#60A5FA" font-family="sans-serif" font-size="10">Ultra-fast sub-40s outreach</text>
      <rect x="15" y="115" width="100" height="40" rx="6" fill="#172554"/>
      <text x="23" y="138" fill="#93C5FD" font-family="monospace" font-size="9">Natural Speech Conversational</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 340 150 L 360 150" stroke="#C084FC" stroke-width="2"/>

    <!-- Step 3 -->
    <g transform="translate(360, 60)">
      <rect x="0" y="0" width="130" height="180" rx="10" fill="#1E1238" stroke="#059669" stroke-width="1"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#10B981"/>
      <text x="23" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">03</text>
      <text x="15" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Calendar Synced</text>
      <text x="15" y="85" fill="#34D399" font-family="sans-serif" font-size="10">Booked with closer</text>
      <rect x="15" y="115" width="100" height="40" rx="6" fill="#064E3B"/>
      <text x="23" y="138" fill="#A7F3D0" font-family="monospace" font-size="9">CRM Pipeline: $25K+ Deal</text>
    </g>
  </g>
</svg>
