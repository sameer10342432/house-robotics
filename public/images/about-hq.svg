<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="hqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#140E2D"/>
      <stop offset="100%" stop-color="#040209"/>
    </linearGradient>
    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hqBg)"/>
  
  <!-- Architectural Studio Elements -->
  <!-- Floor Grid -->
  <path d="M 0 450 L 1200 450 L 1200 675 L 0 675 Z" fill="#07050E"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="200" y1="450" x2="0" y2="675" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="400" y1="450" x2="250" y2="675" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="600" y1="450" x2="600" y2="675" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="800" y1="450" x2="950" y2="675" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="1000" y1="450" x2="1200" y2="675" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Back Glass Wall with City Skyline Silhouette -->
  <g opacity="0.3">
    <rect x="150" y="240" width="80" height="210" fill="#2E1065"/>
    <rect x="250" y="190" width="110" height="260" fill="#3B0764"/>
    <rect x="380" y="270" width="90" height="180" fill="#1E1B4B"/>
    <rect x="490" y="160" width="130" height="290" fill="#2E1065"/>
    <rect x="640" y="220" width="100" height="230" fill="#3B0764"/>
    <rect x="760" y="180" width="120" height="270" fill="#1E1B4B"/>
    <rect x="900" y="250" width="100" height="200" fill="#2E1065"/>
  </g>

  <!-- Big Glowing Neon "HOUSE ROBOTICS LAB" Sign on Back Wall -->
  <rect x="360" y="80" width="480" height="70" rx="16" fill="#1E1346" stroke="#8B5CF6" stroke-width="2" opacity="0.8"/>
  <text x="600" y="125" fill="#DDD6FE" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">HOUSE ROBOTICS // RESEARCH STUDIO</text>
  
  <!-- Collaborative Glass Conference Pod in Center -->
  <g transform="translate(320, 200)">
    <rect x="0" y="0" width="560" height="230" rx="18" fill="#150E33" fill-opacity="0.75" stroke="#6D28D9" stroke-width="1.5"/>
    
    <!-- Table & Screen inside Glass Studio -->
    <rect x="180" y="40" width="200" height="90" rx="8" fill="#0C0A1D" stroke="#A855F7" stroke-width="1"/>
    <text x="210" y="70" fill="#C084FC" font-family="monospace" font-size="10">AUTONOMOUS DISCOVERY</text>
    <path d="M 200 110 Q 240 85 280 100 T 360 80" fill="none" stroke="#34D399" stroke-width="2"/>
    
    <!-- Long Boardroom Desk -->
    <ellipse cx="280" cy="180" rx="220" ry="25" fill="#1F1745" stroke="#4C1D95" stroke-width="1.5"/>

    <!-- Engineers Silhouettes / Collaborators -->
    <circle cx="160" cy="140" r="16" fill="#A78BFA"/>
    <path d="M 140 175 C 145 155, 175 155, 180 175 Z" fill="#6D28D9"/>
    
    <circle cx="280" cy="130" r="16" fill="#C084FC"/>
    <path d="M 260 165 C 265 145, 295 145, 300 165 Z" fill="#7C3AED"/>
    
    <circle cx="400" cy="140" r="16" fill="#38BDF8"/>
    <path d="M 380 175 C 385 155, 415 155, 420 175 Z" fill="#0284C7"/>
  </g>

  <!-- Left Futuristic Server Rack & Workstation -->
  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="160" height="240" rx="10" fill="#0B0918" stroke="#312E81" stroke-width="1.5"/>
    <rect x="15" y="20" width="130" height="25" rx="4" fill="#181438"/>
    <circle cx="30" cy="32" r="3" fill="#10B981"/><circle cx="40" cy="32" r="3" fill="#10B981"/><circle cx="50" cy="32" r="3" fill="#38BDF8"/>
    <rect x="15" y="60" width="130" height="25" rx="4" fill="#181438"/>
    <circle cx="30" cy="72" r="3" fill="#10B981"/><circle cx="40" cy="72" r="3" fill="#8B5CF6"/>
    <rect x="15" y="100" width="130" height="25" rx="4" fill="#181438"/>
    <circle cx="30" cy="112" r="3" fill="#10B981"/><circle cx="40" cy="112" r="3" fill="#10B981"/>
    <rect x="15" y="140" width="130" height="80" rx="4" fill="#110E28"/>
    <text x="25" y="165" fill="#A5B4FC" font-family="monospace" font-size="9">RACK 01: AI AGENTS</text>
    <text x="25" y="185" fill="#34D399" font-family="monospace" font-size="9">STATUS: OPTIMAL</text>
    <text x="25" y="205" fill="#C4B5FD" font-family="monospace" font-size="9">UPTIME: 99.99%</text>
  </g>

  <!-- Right Holographic Metrics Terminal -->
  <g transform="translate(980, 260)">
    <rect x="0" y="0" width="160" height="240" rx="10" fill="#0B0918" stroke="#059669" stroke-width="1.5"/>
    <rect x="15" y="20" width="130" height="40" rx="6" fill="#064E3B"/>
    <text x="25" y="38" fill="#6EE7B7" font-family="sans-serif" font-size="9" font-weight="bold">GLOBAL PIPELINE</text>
    <text x="25" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">$48.2M GENERATED</text>
    
    <rect x="15" y="75" width="130" height="145" rx="6" fill="#0B1C16"/>
    <text x="25" y="100" fill="#A7F3D0" font-family="sans-serif" font-size="9" font-weight="bold">ACTIVE CLIENTS</text>
    <text x="25" y="125" fill="#34D399" font-family="sans-serif" font-size="22" font-weight="bold">45+ Brands</text>
    <text x="25" y="150" fill="#94A3B8" font-family="sans-serif" font-size="9">US · UK · UAE · EU</text>
    <rect x="25" y="170" width="110" height="30" rx="6" fill="#047857"/>
    <text x="35" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">SOC2 Audited</text>
  </g>
</svg>
