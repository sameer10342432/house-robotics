<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (House Robotics Violet to Blue) -->
    <linearGradient id="hr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Core AI Glow Gradient -->
    <linearGradient id="hr-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow for depth -->
    <filter id="hr-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#09051E" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Premium Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="124" ry="124" fill="url(#hr-bg)" />
  
  <!-- Subtle High-tech Border Glow -->
  <rect x="20" y="20" width="472" height="472" rx="124" ry="124" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />

  <!-- Iconic 'H' & Robotics Intelligence Core -->
  <g filter="url(#hr-shadow)">
    <!-- Left Pillar -->
    <rect x="130" y="124" width="68" height="264" rx="22" fill="#FFFFFF" />

    <!-- Right Pillar -->
    <rect x="314" y="124" width="68" height="264" rx="22" fill="#FFFFFF" />

    <!-- Center Bridge -->
    <rect x="180" y="226" width="152" height="60" rx="16" fill="#FFFFFF" />

    <!-- Robotics Center Core -->
    <circle cx="256" cy="256" r="24" fill="url(#hr-cyan)" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />

    <!-- Circuit Tech Accents -->
    <circle cx="164" cy="158" r="11" fill="#38BDF8" />
    <circle cx="348" cy="354" r="11" fill="#38BDF8" />
  </g>
</svg>
